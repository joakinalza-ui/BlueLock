<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>*{touch-action:manipulation;}</style>
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="../../assets/ui/apple-touch-icon.png">
    <meta name="theme-color" content="#070b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blue Lock">
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js");</script>
    <title>Blue Lock Coach — Menú</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div id="menu-screen">
        <header class="menu-header">
            <a class="menu-back" href="../../index.html" aria-label="Volver"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
            <h1>Menú</h1>
        </header>

        <section class="menu-section">
            <h2>Personalizar nombre</h2>
            <div class="name-field">
                <span id="settings-name-display" class="name-field-display"></span>
                <input id="settings-name-input" type="text" maxlength="8" hidden>
            </div>
            <p class="menu-hint">Toca el nombre para editarlo (máx. 8 caracteres).</p>
        </section>

        <section class="menu-section">
            <h2>Personaje de la Home</h2>
            <div id="character-grid" class="character-grid"></div>
            <div class="character-pagination">
                <button id="character-page-prev" class="character-page-arrow" type="button" aria-label="Página anterior">◀</button>
                <span id="character-page-indicator" class="character-page-indicator"></span>
                <button id="character-page-next" class="character-page-arrow" type="button" aria-label="Página siguiente">▶</button>
            </div>
        </section>

        <section class="menu-section menu-section-debug">
            <h2>Debug</h2>
            <button id="debug-grant-currency-btn" class="debug-btn" type="button">+10.000 Diamantes y Combustible de Ego</button>
            <p class="menu-hint">Añade 10.000 al saldo actual de cada recurso.</p>
        </section>

        <section class="menu-section menu-section-danger">
            <h2>Reiniciar progreso</h2>
            <button id="reset-progress-btn" class="danger-btn" type="button">Reiniciar progreso</button>
        </section>
    </div>

    <div id="reset-confirm-overlay" class="confirm-overlay" hidden>
        <div class="confirm-box">
            <p>¿Estás seguro? Esta acción no se puede deshacer y perderás todo tu progreso.</p>
            <div class="confirm-actions">
                <button id="reset-cancel-btn" class="confirm-btn confirm-btn-secondary" type="button">Cancelar</button>
                <button id="reset-confirm-btn" class="confirm-btn confirm-btn-danger" type="button">Sí, reiniciar</button>
            </div>
        </div>
    </div>

    <script>window.BL_ASSET_BASE = "../../";</script>
    <script src="../../js/main.js"></script>
    <script src="../../js/characters-data.js"></script>
    <script src="menu.js"></script>

</body>
</html>
